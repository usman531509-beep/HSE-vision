/* Visual HSE — precision-instrument skin (flat, opaque, hairlines). See DESIGN.md. */

:root {
  /* ink and paper carry a temperature; hierarchy is ink at opacity */
  --ink: #1b211f;
  --ink-2: rgba(27, 33, 31, .75);
  --muted: rgba(27, 33, 31, .58);
  --soft: rgba(27, 33, 31, .42);

  --shell: #ecebe5;       /* app background */
  --paper: #fbfaf7;       /* panels, cards */
  --sunk: #f3f2ed;        /* wells, table head, hover */
  --line: #e1dfd7;        /* hairline */
  --line-2: #cfccc2;      /* stronger hairline, inputs */
  --track: #e6e4dc;       /* empty cells */

  --accent: #1f4d3f;      /* the one accent: primary actions, current item */
  --accent-2: #163a2f;
  --accent-bg: #e3ebe6;

  /* semantic set, status only */
  --act: #c8343d;   --act-bg: #f8e3e1;   --act-ink: #a3242c;
  --watch: #c98412; --watch-bg: #f6ebd3; --watch-ink: #7f5207;
  --low: #2f8656;   --low-bg: #e0eee5;   --low-ink: #1f6340;
  --off: #8a8f8b;   --off-bg: #eceae4;   --off-ink: #4f5551;

  --r-lg: 10px; --r-md: 8px; --r-sm: 6px;
  --ease: cubic-bezier(.16, 1, .3, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font: 14px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-feature-settings: "cv11", "ss01";
  color: var(--ink);
  background: var(--shell);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; }
table { border-collapse: collapse; border-spacing: 0; width: 100%; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.i { display: inline-flex; flex: none; width: 18px; height: 18px; }
.i svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* ------------------------------------------------------------ shell */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }

.sidebar {
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column;
  padding: 16px 12px 14px;
  background: var(--paper);
  border-right: 1px solid var(--line);
  overflow-y: auto; scrollbar-width: thin;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand-mark { width: 28px; height: 28px; border-radius: var(--r-sm); display: grid; place-items: center; background: var(--accent); color: var(--paper); flex: none; }
.brand-mark .i { width: 16px; height: 16px; }
.brand b { display: block; font-size: 14.5px; font-weight: 600; letter-spacing: -.01em; }
.brand small { display: block; font-size: 11.5px; color: var(--muted); }

.search { display: flex; align-items: center; gap: 8px; height: 34px; margin: 16px 0 4px; padding: 0 10px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--paper); color: var(--muted); }
.search:focus-within { border-color: var(--line-2); }
.search .i { width: 16px; height: 16px; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 13px; color: var(--ink); }
.search input::placeholder { color: var(--soft); }

.nav-label { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--soft); padding: 16px 10px 6px; }
.nav a {
  position: relative; display: flex; align-items: center; gap: 10px;
  height: 34px; padding: 0 10px; border-radius: var(--r-sm);
  font-size: 13.5px; color: var(--ink-2);
}
.nav a .i { width: 17px; height: 17px; color: var(--soft); }
.nav a:hover { background: var(--sunk); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--accent-bg); color: var(--accent-2); font-weight: 500; }
.nav a[aria-current="page"] .i { color: var(--accent); }
.nav .count { margin-left: auto; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.count.act { color: var(--act-ink); }
.count.watch { color: var(--watch-ink); }

.sites a { font-size: 13px; height: 32px; }
.sites .lvl { width: 6px; height: 6px; border-radius: 50%; flex: none; margin: 0 6px 0 5px; }
.sites .score { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.ask { margin-top: auto; padding: 14px 8px 2px; border-top: 1px solid var(--line); }
.ask label { display: block; font-size: 13px; font-weight: 600; }
.ask p { font-size: 12px; color: var(--muted); margin-top: 2px; }
.ask-field { display: flex; align-items: center; gap: 6px; margin-top: 10px; height: 36px; padding: 0 3px 0 10px; border-radius: var(--r-md); border: 1px solid var(--line-2); background: var(--paper); }
.ask-field:focus-within { border-color: var(--accent); }
.ask-field input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 12.5px; }
.ask-field input::placeholder { color: var(--soft); }
.ask-field button { width: 28px; height: 28px; border-radius: var(--r-sm); display: grid; place-items: center; background: var(--accent); color: var(--paper); }
.ask-field .i { width: 15px; height: 15px; }

/* ------------------------------------------------------------ top bar */
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  height: 52px; padding: 0 24px;
  background: var(--shell); border-bottom: 1px solid var(--line);
}
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 13px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.pill .i { width: 15px; height: 15px; color: var(--soft); }
.pill + .pill::before { content: ""; width: 1px; height: 16px; background: var(--line-2); margin: 0 10px 0 4px; }
.pill.here { color: var(--ink); font-weight: 600; }
.pill.here .disc { display: none; }
.tools { display: flex; align-items: center; gap: 6px; }
.live { display: inline-flex; align-items: center; gap: 7px; margin-right: 8px; font-size: 12px; font-weight: 600; color: var(--low-ink); }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--low); }
.round { position: relative; width: 36px; height: 36px; border-radius: var(--r-md); display: grid; place-items: center; color: var(--ink-2); }
.round:hover { background: var(--sunk); color: var(--ink); }
.round .dot { position: absolute; top: 8px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--act); }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-bg); font-size: 12px; font-weight: 600; color: var(--accent-2); }
.menu-btn { display: none; }

#content { padding: 0 24px 32px; }

/* ------------------------------------------------------------ page head */
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px 24px; flex-wrap: wrap; margin: 24px 0 18px; }
.page-head h1 { font-size: 26px; font-weight: 500; letter-spacing: -.025em; line-height: 1.1; }
.page-head p { color: var(--muted); margin-top: 6px; max-width: 640px; font-size: 14px; }
.head-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.facts { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.fact b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------ buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: var(--r-md); font-size: 13px; font-weight: 500; white-space: nowrap; border: 1px solid transparent; transition: background .15s var(--ease), border-color .15s var(--ease); }
.btn .i { width: 16px; height: 16px; }
.btn.dark { background: var(--accent); color: var(--paper); }
.btn.dark:hover { background: var(--accent-2); }
.btn.light { background: var(--paper); border-color: var(--line-2); color: var(--ink); }
.btn.light:hover { background: var(--sunk); }
.btn.sm { height: 30px; padding: 0 11px; font-size: 12.5px; }
.btn.ok { background: var(--low-bg); color: var(--low-ink); }
.btn[disabled] { cursor: default; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: var(--r-md); background: var(--sunk); border: 1px solid var(--line); }
.seg button { height: 28px; padding: 0 12px; border-radius: var(--r-sm); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--paper); color: var(--ink); font-weight: 500; box-shadow: 0 0 0 1px var(--line-2); }
.arrow { width: 30px; height: 30px; border-radius: var(--r-sm); display: grid; place-items: center; color: var(--muted); }
.arrow:hover { background: var(--sunk); color: var(--ink); }
.arrow .i { width: 16px; height: 16px; }
.link { font-size: 13px; font-weight: 500; color: var(--accent); }
.link:hover { text-decoration: underline; }

/* ------------------------------------------------------------ panel & cards */
.panel { display: flex; flex-direction: column; gap: 16px; }
.card {
  min-width: 0; padding: 18px 20px;
  border-radius: var(--r-lg);
  background: var(--paper);
  border: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 14px;
}
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.card-head h2 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.card-head .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
/* a note card: same paper, set apart by an accent rule, not a dark fill */
.card.note { border-left: 3px solid var(--accent); }

.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-wide { grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); }
.g-narrow { grid-template-columns: minmax(0, 1fr) minmax(0, 1.65fr); }

/* ------------------------------------------------------------ text bits */
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--soft); }
.meta { font-size: 12.5px; color: var(--muted); }
.num { font-weight: 500; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.05; }
.num .u { color: var(--soft); font-size: .5em; font-weight: 400; letter-spacing: 0; margin-left: 2px; }
.mono { font-variant-numeric: tabular-nums; }

/* status: coloured type with a dot, no pill */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; font-style: normal; color: var(--off-ink); }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.act { color: var(--act-ink); } .chip.act::before { background: var(--act); }
.chip.watch { color: var(--watch-ink); } .chip.watch::before { background: var(--watch); }
.chip.low { color: var(--low-ink); } .chip.low::before { background: var(--low); }
.chip.off, .chip.info { color: var(--off-ink); } .chip.off::before, .chip.info::before { background: var(--off); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; flex: none; }
.dot.act { background: var(--act); } .dot.watch { background: var(--watch); } .dot.low { background: var(--low); } .dot.off { background: var(--off); }
.sq { display: inline-block; width: 10px; height: 10px; border-radius: 2px; flex: none; }
.sq.act { background: var(--act); } .sq.watch { background: var(--watch); } .sq.low { background: var(--low); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* ------------------------------------------------------------ KPI strip */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); }
.kpi { padding: 16px 20px; border-left: 1px solid var(--line); min-width: 0; }
.kpi:first-child { border-left: 0; }
.kpi-top { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.kpi-top .ico { display: none; }
.kpi .num { font-size: 28px; margin-top: 8px; }
.kpi .meta { margin-top: 4px; }
.kpi-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }

/* ------------------------------------------------------------ rows & lists */
.list { display: flex; flex-direction: column; }
.row {
  display: flex; align-items: center; gap: 12px;
  min-height: 52px; padding: 10px 8px;
  border-top: 1px solid var(--line);
  text-align: left; width: 100%;
  transition: background .15s var(--ease);
}
.list > .row:first-child, .list > li:first-child > .row, .list > li:first-child.row { border-top: 0; }
button.row:hover, .row.clickable:hover { background: var(--sunk); }
.row[aria-pressed="true"], .row[aria-selected="true"] { background: var(--accent-bg); box-shadow: inset 3px 0 0 var(--accent); }
/* icons are bare glyphs */
.ico { width: 22px; height: 22px; display: grid; place-items: center; flex: none; color: var(--soft); }
.ico .i { width: 18px; height: 18px; }
.ico.act { color: var(--act); } .ico.watch { color: var(--watch); } .ico.low { color: var(--low); }
.row-main { flex: 1; min-width: 0; }
.row-main b { display: block; font-size: 13.5px; font-weight: 500; }
.row-main .meta { display: block; margin-top: 1px; }
.row-side { text-align: right; flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.row-side .meta { display: inline-flex; align-items: center; gap: 6px; }
.t-act { color: var(--act-ink); } .t-watch { color: var(--watch-ink); } .t-low { color: var(--low-ink); }

/* tables: hairline rows, one divider system */
.tbl-wrap { overflow-x: auto; }
.tbl { font-size: 13px; }
.tbl th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); padding: 8px 12px; background: var(--sunk); white-space: nowrap; }
.tbl th:first-child { border-radius: var(--r-sm) 0 0 var(--r-sm); }
.tbl th:last-child { border-radius: 0 var(--r-sm) var(--r-sm) 0; }
.tbl td { padding: 11px 12px; border-bottom: 1px solid var(--line); color: var(--ink-2); vertical-align: middle; font-variant-numeric: tabular-nums; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover td { background: var(--sunk); }
.tbl td:first-child { color: var(--ink); font-weight: 500; }
.tbl tr.warn td:first-child { box-shadow: inset 3px 0 0 var(--act); }

/* filters */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { height: 30px; padding: 0 11px; border-radius: var(--r-sm); font-size: 12.5px; font-weight: 500; color: var(--ink-2); background: var(--paper); border: 1px solid var(--line-2); }
.chips button:hover { background: var(--sunk); }
.chips button[aria-pressed="true"] { background: var(--accent); color: var(--paper); border-color: var(--accent); }

/* checks */
.checks { display: flex; flex-direction: column; gap: 6px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
.check .i { width: 16px; height: 16px; }
.check .i svg { stroke-width: 2.4; }
.check.ok .i { color: var(--low); }
.check.no .i { color: var(--act); }
.check.wait .i { color: var(--watch); }
.check.wait .i svg { stroke-width: 2; }

.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.kv:last-child { border-bottom: 0; }
.kv span { color: var(--muted); }
.kv b { font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }

/* progress as cells */
.cells { display: grid; gap: 2px; }
.cells span { height: 6px; border-radius: 1px; background: var(--track); }
.cells span.on { background: var(--low); }
.cells.watch span.on { background: var(--watch); }
.cells.act span.on { background: var(--act); }

.switch { position: relative; width: 36px; height: 20px; border-radius: 99px; background: var(--line-2); flex: none; transition: background .2s var(--ease); }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--paper); transition: left .2s var(--ease); }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { left: 18px; }

/* ------------------------------------------------------------ Control room: ranked zone strip */
.zstrip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); margin-bottom: 16px; overflow: clip; }
.zt {
  position: relative; display: flex; flex-direction: column; gap: 6px;
  padding: 14px 16px 16px; text-align: left; min-width: 0;
  border-left: 1px solid var(--line);
  transition: background .15s var(--ease);
}
.zt:first-child { border-left: 0; }
.zt::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--off); }
.zt.act::before { background: var(--act); } .zt.watch::before { background: var(--watch); } .zt.low::before { background: var(--low); }
.zt:hover { background: var(--sunk); }
.zt[aria-pressed="true"] { background: var(--accent-bg); }
.zt-top { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
.zt-rank { font-size: 12px; color: var(--soft); font-variant-numeric: tabular-nums; }
.zt-name { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.zt-lvl { margin-left: auto; font-size: 12px; font-weight: 600; }
.zt-score { font-size: 30px; margin-top: 2px; }
.zt-cause { font-size: 12.5px; color: var(--muted); line-height: 1.35; min-height: 2.7em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.zt .cells { margin-top: 2px; }

.cr-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, .82fr) minmax(0, 1.05fr); grid-template-rows: auto 1fr; gap: 16px; }
.cr-zones { grid-row: 1 / span 2; }
.cr-events { grid-column: 2 / span 2; }

.zone-row { display: grid; grid-template-columns: minmax(0, 1fr) 120px 40px; align-items: center; gap: 14px; min-height: 50px; }
.zone-row .score { font-size: 18px; text-align: right; }
.zone-row .cells { grid-template-columns: repeat(20, 1fr); }
.zone-detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
.next-step { padding: 2px 0 2px 14px; border-left: 3px solid var(--accent); }
.next-step p { font-size: 13.5px; margin-top: 4px; line-height: 1.45; }

.gauge { position: relative; width: 100%; max-width: 220px; margin: 0 auto; aspect-ratio: 156 / 84; }
.gauge svg { width: 100%; height: 100%; display: block; }
.gauge-val { position: absolute; left: 0; right: 0; bottom: -2px; text-align: center; }
.gauge-val .num { font-size: 26px; }
.gauge-foot { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; padding-top: 12px; border-top: 1px solid var(--line); }
.gauge-foot b { display: block; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }

.shift { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; position: relative; }
.shift-col { display: grid; grid-template-rows: repeat(10, 1fr); gap: 2px; height: 128px; }
.shift-col span { border-radius: 1px; background: var(--track); }
.shift .thr { position: absolute; left: -4px; right: -4px; top: calc(30% - 1px); border-top: 1px dashed var(--act); pointer-events: none; }
.shift-x { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; text-align: center; font-size: 11.5px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
.shift-x .peak { color: var(--ink); font-weight: 600; }

.decision { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: var(--r-md); border: 1px solid var(--line); }
.decision-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.decision .scene { font-size: 14px; }
.decision .outcome { margin-top: auto; font-size: 13px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--ink-2); }

.tile { padding: 12px 14px; border-radius: var(--r-md); border: 1px solid var(--line); }
.tile .num { font-size: 22px; margin-top: 4px; }
.tile .meta { margin-top: 3px; }

.foot { display: flex; justify-content: space-between; gap: 8px 24px; flex-wrap: wrap; padding: 4px 2px 0; font-size: 12px; color: var(--soft); }

/* ------------------------------------------------------------ Live floor */
.cam-view { position: relative; aspect-ratio: 16 / 9; border-radius: var(--r-md); overflow: hidden; background: #262b29; color: #f1f0ea; }
.cam-view .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 34%; background: #2d3330; border-top: 1px solid rgba(241,240,234,.08); }
.cam-box { position: absolute; border: 2px solid; border-radius: 3px; }
.cam-box span { position: absolute; left: -2px; top: -22px; font-size: 11.5px; font-weight: 600; padding: 2px 6px; border-radius: 3px; color: #111; white-space: nowrap; }
.cam-hud { position: absolute; left: 14px; top: 12px; right: 14px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
.cam-hud .rec { display: inline-flex; align-items: center; gap: 6px; }
.cam-hud .rec::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--act); }
.cam-off { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; color: rgba(241,240,234,.7); background: #262b29; }
.cam-caption { position: absolute; left: 14px; right: 14px; bottom: 12px; font-size: 13px; }
.cam-list { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.cam-list button { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 9px 11px; border-radius: var(--r-md); border: 1px solid var(--line); text-align: left; }
.cam-list button:hover { background: var(--sunk); }
.cam-list button b { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; }
.cam-list button span { font-size: 12px; color: var(--muted); }
.cam-list button[aria-pressed="true"] { background: var(--accent-bg); border-color: var(--accent); }

.plan { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 88px); gap: 6px; }
.plan-zone { border-radius: var(--r-sm); padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--line); border-top-width: 3px; font-size: 12.5px; }
.plan-zone b { font-weight: 600; font-size: 13px; }
.plan-zone.act { border-top-color: var(--act); background: var(--act-bg); }
.plan-zone.watch { border-top-color: var(--watch); }
.plan-zone.low { border-top-color: var(--low); }
.plan-zone .meta { color: var(--ink-2); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 8px; }

.sensor .num { font-size: 24px; }
.spark { display: grid; grid-template-columns: repeat(12, 1fr); align-items: end; gap: 3px; height: 36px; }
.spark span { border-radius: 1px; background: var(--line-2); }
.spark span.last.low { background: var(--low); } .spark span.last.watch { background: var(--watch); } .spark span.last.act { background: var(--act); }

/* ------------------------------------------------------------ Incidents */
.stepper { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.step { font-size: 12.5px; }
.step i { display: block; height: 3px; background: var(--track); margin-bottom: 8px; }
.step.done i { background: var(--low); } .step.now i { background: var(--watch); }
.step b { font-weight: 600; display: block; color: var(--ink); }
.step span { color: var(--muted); }
.causes { counter-reset: c; display: flex; flex-direction: column; gap: 8px; }
.causes li { counter-increment: c; display: flex; gap: 10px; font-size: 13.5px; }
.causes li::before { content: counter(c) "."; flex: none; width: 16px; font-size: 13px; font-weight: 600; color: var(--soft); font-variant-numeric: tabular-nums; }
.signoff { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 14px; border-top: 1px solid var(--line); }

/* ------------------------------------------------------------ Permits */
.permit { display: flex; flex-direction: column; gap: 12px; }
.permit .work { font-size: 14px; }
.timeleft { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink-2); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
.req { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
.req:first-child { border-top: 0; padding-top: 0; }
.req-checks { display: flex; gap: 8px 16px; flex-wrap: wrap; margin-top: 10px; }
.req-actions { display: flex; gap: 8px; }

/* ------------------------------------------------------------ Inspections */
.progress { height: 4px; background: var(--track); overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--low); transition: width .3s var(--ease); }
.check-item { display: flex; align-items: center; gap: 14px; padding: 10px 0; border-top: 1px solid var(--line); }
.pf { display: inline-flex; gap: 4px; flex: none; }
.pf button { height: 30px; min-width: 52px; padding: 0 10px; border-radius: var(--r-sm); font-size: 12.5px; font-weight: 600; color: var(--muted); border: 1px solid var(--line-2); }
.pf button:hover { background: var(--sunk); }
.pf button[aria-pressed="true"].pass { background: var(--low-bg); color: var(--low-ink); border-color: var(--low); }
.pf button[aria-pressed="true"].fail { background: var(--act-bg); color: var(--act-ink); border-color: var(--act); }
.pf button[aria-pressed="true"].na { background: var(--off-bg); color: var(--off-ink); border-color: var(--off); }
.photos { display: flex; gap: 8px; flex-wrap: wrap; }
.photo { width: 140px; height: 90px; border-radius: var(--r-sm); display: flex; align-items: flex-end; padding: 8px 10px; font-size: 12px; color: #f1f0ea; background: #2d3330; }
.photo.add { color: var(--muted); background: transparent; border: 1px dashed var(--line-2); align-items: center; justify-content: center; gap: 6px; font-weight: 500; }

/* ------------------------------------------------------------ Actions board */
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 8px; min-height: 200px; }
.col-head { display: flex; justify-content: space-between; align-items: center; font-size: 13.5px; font-weight: 600; padding: 0 2px 8px; border-bottom: 1px solid var(--line-2); }
.col-head span { font-size: 12px; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.task { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: var(--r-md); background: var(--paper); border: 1px solid var(--line); }
.task-top { display: flex; justify-content: space-between; align-items: center; }
.task-top .mono { font-size: 12px; color: var(--soft); }
.task b { font-weight: 500; font-size: 13.5px; line-height: 1.35; }
.task-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.owner { display: inline-flex; align-items: center; gap: 7px; }
.initials { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 600; background: var(--accent-bg); color: var(--accent-2); }
.late { color: var(--act-ink); font-weight: 600; }
.task .btn { width: 100%; }

/* ------------------------------------------------------------ Training matrix */
.mx td, .mx th { text-align: center; }
.mx td:first-child, .mx th:first-child, .mx td:nth-child(2), .mx th:nth-child(2) { text-align: left; }
.mark { display: inline-grid; place-items: center; width: 24px; height: 24px; font-size: 14px; font-weight: 700; }
.mark.v { color: var(--low); }
.mark.e { color: var(--watch-ink); }
.mark.x { color: var(--act); }
.mark.n { color: var(--soft); }

/* ------------------------------------------------------------ Reports */
.weeks { display: grid; grid-template-columns: 28px repeat(8, 1fr); gap: 6px; align-items: start; margin-top: 8px; }
.weeks .y { display: flex; flex-direction: column; justify-content: space-between; height: 222px; line-height: 14px; font-size: 11.5px; color: var(--soft); text-align: right; margin-top: -7px; font-variant-numeric: tabular-nums; }
.wk { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.wk-bars { display: flex; gap: 3px; align-items: flex-end; height: 208px; }
.wk-bar { width: 14px; display: grid; grid-template-rows: repeat(8, 1fr); gap: 2px; height: 100%; }
.wk-bar span { border-radius: 1px; background: var(--track); }
.wk-bar.inc span.on { background: var(--act); }
.wk-bar.nm span.on { background: var(--accent); }
.wk-label { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.legend .sq[style] { background: var(--accent) !important; }
.brief li { display: flex; gap: 10px; font-size: 13.5px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.brief li:last-child { border-bottom: 0; }
.brief li::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); margin-top: 8px; flex: none; }

/* ------------------------------------------------------------ focus & motion */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ------------------------------------------------------------ responsive */
@media (max-width: 1280px) {
  .cr-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .cr-zones { grid-row: auto; grid-column: 1 / -1; }
  .cr-events { grid-column: 1 / -1; }
  .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 1100px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; z-index: 30; left: 0; top: 0; bottom: 0; height: auto; width: 280px; transform: translateX(-100%); transition: transform .25s var(--ease); }
  .sidebar.open { transform: none; }
  .menu-btn { display: grid; }
  .scrim { position: fixed; inset: 0; z-index: 25; background: rgba(27,33,31,.3); }
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-wide, .g-narrow, .g3 { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi:nth-child(3) { border-left: 0; }
  .kpi:nth-child(n+3) { border-top: 1px solid var(--line); }
  .zstrip { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .zt:nth-child(4) { border-left: 0; }
  .zt:nth-child(n+4) { border-top: 1px solid var(--line); }
}
@media (max-width: 720px) {
  .topbar, #content { padding-left: 16px; padding-right: 16px; }
  .crumbs .pill:not(.here) { display: none; }
  .live { display: none; }
  .page-head h1 { font-size: 22px; }
  .card { padding: 14px 16px; }
  .cr-grid, .g2, .g4, .board, .zone-detail { grid-template-columns: minmax(0, 1fr); }
  .cr-events { grid-column: auto; }
  .kpis { grid-template-columns: minmax(0, 1fr); }
  .kpi { border-left: 0; } .kpi + .kpi { border-top: 1px solid var(--line); }
  .zstrip { grid-template-columns: minmax(0, 1fr); }
  .zt { border-left: 0; } .zt + .zt { border-top: 1px solid var(--line); }
  .zone-row { grid-template-columns: minmax(0, 1fr) 40px; }
  .zone-row .cells { display: none; }
  .cam-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .plan { grid-template-rows: repeat(3, 76px); }
  .req { grid-template-columns: minmax(0, 1fr); }
  .check-item { flex-wrap: wrap; }
  .weeks { gap: 3px; } .wk-bar { width: 9px; }
}

/* zone detail: flat facts + next step, no box-in-box */
.zone-detail .tile { padding: 0; border: 0; }
.zone-detail .next-step { align-self: start; }
</style>
</head>

    return '<div class="gauge"><svg viewBox="0 0 156 84" role="img" aria-label="Site risk index ' + risk + ' out of 100">' + out + '</svg>' +

  }
  function shiftChart() {
    var peak = D.trend.reduce(function (m, t) { return t[1] > m[1] ? t : m; });
    var cols = D.trend.map(function (t) {
      var filled = Math.round(t[1] / 10), s = '';
      for (var r = 9; r >= 0; r--) {
        var level = (r + 1) * 10, onCell = r < filled;
        s += '<span' + (onCell ? ' style="background:' + (level > 70 ? 'var(--act)' : level > 40 ? 'var(--watch)' : 'var(--mint)') + '"' : '') + '></span>';
      }
      return '<div class="shift-col" title="' + t[0] + ' · ' + t[1] + '">' + s + '</div>';
    }).join('');
    return '<div><div class="shift" role="img" aria-label="Predicted risk by hour: ' + D.trend.map(function (t) { return t[0] + ' ' + t[1]; }).join(', ') + '">' + cols + '<i class="thr"></i></div>' +
      '<div class="shift-x">' + D.trend.map(function (t) { return '<span' + (t === peak ? ' class="peak"' : '') + '>' + t[0].slice(0, 2) + '</span>'; }).join('') + '</div></div>';
  }
  var MODULE_ICON = { 'Vision-AI': 'camera', 'Chemical & sensors': 'thermo', 'Safety agent': 'shield', 'IoT sensors': 'activity', 'Inspections': 'checkSq', 'Connectors': 'refresh' };

    return D.actions.map(function (a) {
      var st = S.stage[a[0]] != null ? S.stage[a[0]] : a[6];
      return { id: a[0], title: a[1], source: a[2], owner: a[3], due: a[4], pri: a[5], stage: st, late: !!D.actionOverdue[a[4]] && st < 3 };
    });
  }

  function viewControl() {

    var zonesCard = card('Zone risk', 'Each zone is checked against permits, lockout and the shift roster before an alert is raised.',

          '<span class="row-main"><b>' + esc(zo.name) + '</b><span class="meta">' + esc(zo.cause) + '</span></span>' +
          cells(Math.round(zo.score / 5), 20, l) +
          '<span class="num score ' + 't-' + l + '">' + zo.score + '</span></button>';
      }).join('') + '</div>' +
      '<div class="zone-detail"><div class="tile"><div class="eyebrow">' + esc(z.name) + ' · ' + lvlName(z.score) + ' ' + z.score + '</div>' +
        [['Cameras', z.cams], ['Sensors', z.sensors], ['Permit', z.permit], ['Lockout', z.lockout]].map(function (r) {
          return '<div class="kv"><span>' + r[0] + '</span><b>' + esc(r[1]) + '</b></div>';
        }).join('') + '</div>' +
        '<div class="next-step"><div class="eyebrow">Suggested next step</div><p>' + esc(z.action) + '</p></div></div>',
      '<div class="legend"><span><i class="sq act"></i>Act 70+</span><span><i class="sq watch"></i>Watch 40–69</span><span><i class="sq low"></i>Low</span></div>', 'cr-zones');

      '<div class="gauge-foot"><div><span class="meta">Peak this shift</span><b class="t-act">72 · 18:00</b></div><div style="text-align:right"><span class="meta">Act threshold</span><b>70</b></div></div>');

    var shiftCard = card('Risk through the shift', 'Predicted, hourly. Peak at 18:00 during changeover.', shiftChart() +
      '<div class="legend"><span><i class="sq act"></i>Above 70</span><span><i class="sq watch"></i>40–70</span><span><span style="width:16px;border-top:1.5px dashed var(--act)"></span>Act threshold</span></div>');

    var evs = D.events.filter(function (e) { return S.evFilter === 'All' || e[1] === S.evFilter; });

      '<ul class="list" aria-live="polite">' + (evs.length ? evs.map(function (e) {

          '<span class="row-main"><b>' + esc(e[2]) + ' · ' + esc(e[3]) + '</b><span class="meta">' + esc(e[4]) + '</span></span>' +
          '<span class="row-side">' + chip(e[1], t) + '<span class="meta mono">' + e[0] + '</span></span></li>';
      }).join('') : '<li class="meta">No events at this level.</li>') + '</ul>',
      '<div class="chips" role="group" aria-label="Filter by severity">' + ['All', 'High', 'Medium', 'Low'].map(function (f) {
        return '<button' + on('evFilter', f) + ' aria-pressed="' + (S.evFilter === f) + '">' + f + '</button>';
      }).join('') + '</div>', 'cr-events');

    var decisions = card('See · Decide · Act', 'Recent agent decisions, with the facts it checked first.',
      '<div class="grid g3">' + D.decisions.map(function (d) {

          '<span class="row-side">' + chip(STAGE[a.stage], a.stage === 2 ? 'low' : 'info') + '<span class="meta ' + (a.late ? 'late' : '') + '">' + (a.late ? 'Overdue · ' : 'Due ') + esc(a.due) + '</span></span></div>';
      }).join('') + '</div>', '<a class="link" href="#actions">View all actions</a>');

    var audit = card('Audit readiness', '', D.audit.map(function (a) {
      return '<div><div class="kv" style="border:0;padding:0 0 8px"><b style="text-align:left">' + esc(a[0]) + '</b><span>' + a[1] + '% on file</span></div>' +

    }).join(''), '<a class="link" href="#compliance">Compliance</a>');

    return head('Control room', 'Every zone, checked against permits, lockout and the shift roster before an alert is raised.', tools) + fan() +
      '<div class="panel">' +

      '<div class="cr-grid">' + zonesCard + gaugeCard + shiftCard + eventsCard + '</div>' +
      decisions +
      '<div class="grid g-wide">' + follow + '<div class="grid">' + waste + audit + '</div></div>' +
      foot('Sample data for the four-week pilot preview. The software suggests; a qualified person approves every safety and compliance decision.', 'Records support ISO 45001 and ISO 14001 audits.') +
      '</div>';
  }

  /* ================================================================ LIVE FLOOR */
  var BOX = { High: '#ff6a5a', Medium: '#f6b43e', Low: '#35c877' };

          '<span class="meta"><span>' + { act: 'Act', watch: 'Watch', low: 'Low' }[t] + '</span><span>' + (p[6] ? p[6] + ' ' + (p[6] === 1 ? 'person' : 'people') : 'Nobody') + '</span></span></div>';
      }).join('') + '</div>' +

      '<div class="tile"><div class="eyebrow">Watching now</div><p style="margin-top:4px">Danger-zone entry, safety gear, machine and forklift spacing, spills.</p></div>');
    var sensors = card('Sensors', 'Last 12 readings', '<div class="grid g3">' + D.sensors.map(function (s) {
      var max = Math.max.apply(null, s.v), min = Math.min.apply(null, s.v), t = SEV[s.sev];
      var bars = s.v.map(function (v, i) {
        var h = max === min ? 70 : 25 + (v - min) / (max - min) * 75;
        return '<span class="' + (i === s.v.length - 1 ? 'last ' + t : '') + '" style="height:' + h.toFixed(0) + '%"></span>';
      }).join('');
      return '<div class="tile sensor"><div class="kv" style="border:0;padding:0"><span style="color:var(--ink-2)">' + esc(s.label) + '</span>' + chip(s.state, t) + '</div>' +
        '<div class="num">' + num(s.value, s.unit) + '</div><div class="spark" aria-hidden="true" style="margin-top:10px">' + bars + '</div><div class="meta" style="margin-top:8px">' + esc(s.where) + '</div></div>';

      D.machines.map(function (m) {

      }).join('') + '</tbody></table></div>');
    return head('Live floor', 'What the cameras and sensors see right now, zone by zone.',

      '<div class="panel"><div class="grid g-wide">' + camCard + planCard + '</div>' + sensors + machines +
      foot('Sample data for the four-week pilot preview. Video analysis runs on the edge; footage stays on site.') + '</div>';

  /* ================================================================ INCIDENTS */
  function viewIncidents() {
    var list = D.incidents.filter(function (i) { return S.incFilter === 'All' || i.type === S.incFilter; });
    var c = D.incidents.filter(function (i) { return i.id === S.inc; })[0] || D.incidents[0];
    var approved = c.stage === 4 || !!S.approved[c.id];
    var stage = approved ? 4 : c.stage;
    var listCard = card('This month', '', '<div class="chips" role="group" aria-label="Filter by type">' + [['All', 'All'], ['Incident', 'Incidents'], ['Near-miss', 'Near-misses']].map(function (f) {
      return '<button' + on('incFilter', f[0]) + ' aria-pressed="' + (S.incFilter === f[0]) + '">' + f[1] + '</button>';
    }).join('') + '</div><div class="list">' + list.map(function (i) {
      var st = (S.approved[i.id] ? 4 : i.stage);
      return '<button class="row"' + on('inc', i.id) + ' aria-pressed="' + (i.id === c.id) + '" style="align-items:flex-start">' +
        '<span class="row-main"><b>' + esc(i.title) + '</b><span class="meta">' + esc(i.id + ' · ' + i.date + ' ' + i.time + ' · ' + i.zone) + '</span></span>' +

    }).join('') + '</ol>';
    var detail = card(esc(c.title), esc(c.id + ' · ' + c.type + ' · ' + c.zone + ' · ' + c.date + ' ' + c.time),
      steps +
      '<div class="grid g2"><div class="tile"><div class="eyebrow">What happened</div><p style="margin-top:6px">' + esc(c.what) + '</p><div class="meta" style="margin-top:8px">Captured by ' + esc(c.source) + '</div></div>' +
      '<div class="tile"><div class="eyebrow" style="margin-bottom:8px">Likely causes</div><ol class="causes">' + c.causes.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ol></div></div>' +
      '<div><div class="eyebrow" style="margin-bottom:4px">Standards</div><div class="tbl-wrap"><table class="tbl"><tbody>' + c.clauses.map(function (k) {

      }).join('') + '</tbody></table></div></div>' +
      '<div class="signoff"><div style="flex:1;min-width:220px"><b style="font-weight:500">Draft report and follow-up actions</b><p style="margin-top:3px">' + esc(c.draft) + '</p>' +
        '<div class="meta" style="margin-top:4px">' + (approved ? 'Signed off by a qualified person. Filed to the audit pack.' : 'Needs sign-off from a qualified person before it is filed.') + '</div></div>' +
        '<div class="head-tools"><button class="btn light sm">Open draft</button>' +
        (approved ? '<button class="btn sm ok" disabled>' + ic('check') + 'Approved</button>' : '<button class="btn dark sm"' + on('approve', c.id) + '>Approve and file</button>') + '</div></div>',

      foot('Sample data for the four-week pilot preview. Each closed incident feeds back into risk prediction.') + '</div>';
  }

      '<div class="signoff"><span class="' + (fails ? 't-act' : 'meta') + '">' + (fails ? fails + ' failed item' + (fails > 1 ? 's' : '') + ' will become follow-up actions with an owner.' : 'No failed items so far.') + '</span><button class="btn dark sm">Submit inspection</button></div>',
      chip('In progress', 'watch'));
    var findings = card('Recent findings', '', '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Finding</th><th>Inspection</th><th>Date</th><th>Risk</th><th>Action</th></tr></thead><tbody>' +
      D.findings.map(function (f) {
        return '<tr' + (f[3] === 'High' ? ' class="warn"' : '') + '><td>' + esc(f[0]) + '</td><td>' + esc(f[1]) + '</td><td class="mono">' + esc(f[2]) + '</td><td>' + chip(f[3], SEV[f[3]]) + '</td><td><a class="link" href="#actions">' + esc(f[4]) + '</a></td></tr>';
      }).join('') + '</tbody></table></div>');
    return head('Inspections &amp; audits', 'Mobile checklists with photo evidence. Every finding becomes a tracked action.', '<button class="btn light">' + ic('download') + 'Download audit pack</button>') +
      '<div class="panel">' + kpis(D.inspectionKpis.map(function (k) { return [k[0], k[1], k[2], esc(k[3])]; })) +
      '<div class="grid g-narrow">' + sched + list + '</div>' + findings + foot('Sample data for the four-week pilot preview.') + '</div>';
  }

  /* ================================================================ FOLLOW-UP ACTIONS */
  function viewActions() {
    var owner = S.owner;
    var all = openActions().filter(function (a) {
      return owner === 'Everyone' || a.owner === owner || (owner === 'Floor team' && /Floor team|Line lead|Shift supervisor/.test(a.owner));
    });
    var board = '<div class="board">' + D.actionCols.map(function (t, i) {
      var cs = all.filter(function (a) { return a.stage === i; });
      return '<section class="col" aria-label="' + t + '"><div class="col-head">' + t + '<span>' + cs.length + '</span></div>' + (cs.length ? cs.map(function (a) {
        var initials = a.owner.split(' ').map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase();
        return '<article class="task"><div class="task-top"><span class="mono">' + a.id + '</span>' + chip(a.pri, SEV[a.pri]) + '</div><b>' + esc(a.title) + '</b>' +
          '<span class="meta">From ' + esc(a.source) + '</span><div class="task-foot"><span class="owner"><span class="initials" aria-hidden="true">' + initials + '</span>' + esc(a.owner) + '</span>' +
          '<span class="' + (a.late ? 'late' : '') + '">' + (a.late ? 'Overdue · ' : '') + esc(a.due) + '</span></div>' +
          (a.stage < 3 ? '<button class="btn light sm"' + on('move', a.id + '|' + a.stage) + '>' + D.actionNext[a.stage] + '</button>' : '') + '</article>';
      }).join('') : '<p class="meta" style="padding:4px">Nothing here.</p>') + '</section>';
    }).join('') + '</div>';
    return head('Follow-up actions', 'Corrective and preventive actions. Each has an owner and a due date, and cameras confirm the fix before it closes.',
      '<div class="chips" role="group" aria-label="Filter by owner">' + D.actionOwners.map(function (o) {
        return '<button' + on('owner', o) + ' aria-pressed="' + (S.owner === o) + '">' + o + '</button>';
      }).join('') + '</div>') +
      '<div class="panel">' + board + foot('Sample data for the four-week pilot preview.') + '</div>';
  }

  /* ================================================================ COMPLIANCE */
  function viewCompliance() {
    var d = D.standards[S.std];
    var tabs = '<div class="seg" role="tablist" aria-label="Standard">' + Object.keys(D.standards).map(function (k) {
      return '<button role="tab"' + on('std', k) + ' aria-selected="' + (S.std === k) + '">' + k + '</button>';
    }).join('') + '</div>';
    var clauses = card(esc(d.name) + ' · clause by clause', '', '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Clause</th><th>Requirement</th><th>Evidence</th><th>Status</th></tr></thead><tbody>' +
      d.clauses.map(function (c) {
        var t = SEV[D.clauseState[c[3]]];
        return '<tr' + (t === 'act' ? ' class="warn"' : '') + '><td class="mono">' + esc(c[0]) + '</td><td style="color:var(--ink)">' + esc(c[1]) + '</td><td>' + esc(c[2]) + '</td><td>' + chip(c[3], t) + '</td></tr>';
      }).join('') + '</tbody></table></div>');
    var gaps = card('Missing evidence', 'Each linked to a follow-up action', '<div class="list">' + d.gaps.map(function (g) {
      return '<div class="row"><span class="ico act">' + ic('alert') + '</span><span class="row-main"><b>' + esc(g[0]) + '</b><span class="meta">Clause ' + esc(g[1]) + ' · <a class="link" href="#actions">' + esc(g[2]) + '</a></span></span></div>';
    }).join('') + '</div>');
    var ask = card('Ask compliance', '', '<p style="font-size:15px">“' + esc(D.askCompliance.q) + '”</p><p>' + esc(D.askCompliance.a) + '</p>' +
      '<div class="chips">' + D.askCompliance.refs.map(function (r) { return '<span class="chip off">' + esc(r) + '</span>'; }).join('') + '</div>', '', 'note');
    return head('Compliance', 'Live mapping of site activity to each standard, and the evidence still missing.', tabs) +
      '<div class="panel">' + kpis([
        ['Evidence on file', d.pct, '%', '', '', '<div style="margin-top:10px">' + cells(Math.round(d.pct / 4), 25) + '</div>'],
        ['Clauses covered', d.covered.split(' of ')[0], 'of ' + d.covered.split(' of ')[1], esc(d.scope)],
        ['Gaps to close', d.gaps.length, '', 'Each linked to a follow-up action'],
        ['Next audit', d.next, '', esc(d.nextNote)]
      ]) + '<div class="grid g-wide">' + clauses + '<div class="grid" style="align-content:start">' + gaps + ask + '</div></div>' +
      foot('Sample data for the four-week pilot preview. A qualified person reviews every compliance decision.') + '</div>';
  }

  /* ================================================================ TRAINING */
  var MARK = { v: ['✓', 'Valid'], e: ['!', 'Expires within 30 days'], x: ['✕', 'Expired or missing'], n: ['–', 'Not needed'] };
  function viewTraining() {
    var rows = D.people.filter(function (p) { return !S.gapsOnly || /[xe]/.test(p[2]); });
    var matrix = card('Shift B · competency matrix', '', '<div class="tbl-wrap"><table class="tbl mx"><thead><tr><th>Worker</th><th>Role</th>' + D.courses.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.map(function (p) {
        return '<tr' + (/x/.test(p[2]) ? ' class="warn"' : '') + '><td>' + esc(p[0]) + '</td><td>' + esc(p[1]) + '</td>' + p[2].split('').map(function (k, i) {
          return '<td><span class="mark ' + k + '" title="' + esc(D.courses[i] + ': ' + MARK[k][1]) + '">' + MARK[k][0] + '<span class="sr">' + esc(MARK[k][1]) + '</span></span></td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>',
      '<div class="legend">' + ['v', 'e', 'x', 'n'].map(function (k) { return '<span><span class="mark ' + k + '" style="width:22px;height:22px;font-size:11.5px">' + MARK[k][0] + '</span>' + MARK[k][1] + '</span>'; }).join('') + '</div>');
    var attention = card('Needs attention', '', '<div class="list">' + D.attention.map(function (a) {
      return '<div class="row"><span class="row-main"><b>' + esc(a[0] + ' · ' + a[1]) + '</b><span class="meta">' + esc(a[2]) + '</span></span>' + chip(a[3], SEV[a[4]]) + '<button class="btn light sm">Book course</button></div>';
    }).join('') + '</div>');
    var reminders = card('Automatic reminders', 'Sent in Urdu or English, by text or voice.', '<div>' + D.reminders.map(function (r) {
      return '<div class="kv"><span>' + esc(r[0]) + '</span><b' + (r[1] === 'Permits blocked' ? ' class="t-act"' : '') + '>' + esc(r[1]) + '</b></div>';
    }).join('') + '</div>');
    return head('Training &amp; competency', 'Who is trained for what. The agent checks this against the shift roster before it approves a permit.',
      '<button class="btn ' + (S.gapsOnly ? 'dark' : 'light') + '"' + on('gaps') + ' aria-pressed="' + S.gapsOnly + '">Show only people with gaps</button>') +
      '<div class="panel">' + kpis(D.trainingKpis.map(function (k) { return [k[0], k[1], k[2], esc(k[3])]; })) + matrix +
      '<div class="grid g-wide">' + attention + reminders + '</div>' + foot('Sample data for the four-week pilot preview.') + '</div>';
  }

  /* ================================================================ REPORTS */
  function viewReports() {
    var chart = '<div class="weeks" role="img" aria-label="Incidents and near-misses by week: ' + D.weeks.map(function (w) { return w[0] + ' ' + w[1] + ' incidents, ' + w[2] + ' near-misses'; }).join('; ') + '">' +
      '<div class="y"><span>8</span><span>4</span><span>0</span></div>' + D.weeks.map(function (w) {
        function bar(v, cls) { var s = ''; for (var r = 7; r >= 0; r--) s += '<span' + (r < v ? ' class="on"' : '') + '></span>'; return '<div class="wk-bar ' + cls + '">' + s + '</div>'; }
        return '<div class="wk"><div class="wk-bars">' + bar(w[1], 'inc') + bar(w[2], 'nm') + '</div><span class="wk-label">' + w[0] + '</span></div>';
      }).join('') + '</div>';
    var trend = card('Incidents and near-misses, by week', 'More near-misses reported, fewer incidents: problems are caught earlier.', chart,
      '<div class="legend"><span><i class="sq act"></i>Incidents</span><span><i class="sq" style="background:var(--deep-2)"></i>Near-misses</span></div>');
    var brief = card('Wednesday, 25 November', 'Morning briefing · sent 06:30',
      '<ul class="brief">' + D.briefing.map(function (b) { return '<li>' + esc(b) + '</li>'; }).join('') + '</ul><p class="meta">Sent to 6 people in English and Urdu. Every line links to its source.</p>', '', 'note');
    var lib = card('Report library', '', '<div class="list">' + D.reports.map(function (r) {
      return '<div class="row"><span class="ico">' + ic('file') + '</span><span class="row-main"><b>' + esc(r[0]) + '</b><span class="meta">' + esc(r[1]) + '</span></span>' + chip(r[2], SEV[D.reportState[r[2]]]) +
        '<span class="head-tools"><button class="btn light sm" aria-label="' + esc(r[0]) + ' as PDF">PDF</button><button class="btn light sm" aria-label="' + esc(r[0]) + ' as Excel">Excel</button></span></div>';
    }).join('') + '</div>');
    var routines = card('Routines', 'Run on a schedule or a trigger, without anyone asking.', '<div class="list">' + D.routines.map(function (r, i) {
      var onn = !S.routinesOff[i];
      return '<div class="row"><span class="row-main"><b>' + esc(r[0]) + '</b><span class="meta">' + esc(r[1]) + '</span></span><button class="switch" role="switch" aria-checked="' + onn + '" aria-label="' + esc(r[0]) + '"' + on('routine', i) + '></button></div>';
    }).join('') + '</div>');
    return head('Reports', 'What leadership opens every morning, plus the reports that write themselves.', '<button class="btn dark">' + ic('plus') + 'New report</button>') +
      '<div class="panel"><div class="grid g-wide">' + trend + brief + '</div><div class="grid g-wide">' + lib + routines + '</div>' +
      foot('Sample data for the four-week pilot preview. Reports are drafted by the software and approved by a person before they are filed.') + '</div>';
  }

  var VIEWS = { control: viewControl, live: viewLive, incidents: viewIncidents, permits: viewPermits, inspections: viewInspections, actions: viewActions, compliance: viewCompliance, training: viewTraining, reports: viewReports };

  /* ================================================================ render & events */
  var content = document.getElementById('content');
  function render(keepFocus) {
    var f = document.activeElement, key = keepFocus && f && f.dataset && f.dataset.on ? '[data-on="' + f.dataset.on + '"]' + (f.dataset.arg != null ? '[data-arg="' + CSS.escape(f.dataset.arg) + '"]' : '') : null;
    content.innerHTML = VIEWS[S.route]();
    if (key) { var el = content.querySelector(key); if (el) el.focus({ preventScroll: true }); }
  }
  function go() {
    var id = (location.hash || '#control').slice(1);
    S.route = VIEWS[id] ? id : 'control';
    updateShell(); render(false);
    closeMenu();
    window.scrollTo(0, 0);
  }

  var ACT = {
    range: function (a) { S.range = a; },
    zone: function (a) {
      S.zone = a;
      if (S.route !== 'control') { location.hash = '#control'; return 'nav'; }
    },
    evFilter: function (a) { S.evFilter = a; },
    cam: function (a) { S.cam = a; },
    incFilter: function (a) { S.incFilter = a; },
    inc: function (a) { S.inc = a; },
    approve: function (a) { S.approved[a] = true; },
    permit: function (a) { var p = a.split('|'); S.permitDecisions[p[0]] = p[1]; },
    answer: function (a) { var p = a.split('|'); S.answers[p[0]] = p[1]; },
    owner: function (a) { S.owner = a; },
    move: function (a) { var p = a.split('|'); S.stage[p[0]] = +p[1] + 1; },
    std: function (a) { S.std = a; },
    gaps: function () { S.gapsOnly = !S.gapsOnly; },
    routine: function (a) { S.routinesOff[a] = !S.routinesOff[a]; },
    menu: function () { openMenu(); return 'skip'; }
  };
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-on]');
    if (!t) return;
    if (t.tagName === 'A') e.preventDefault();
    var r = ACT[t.dataset.on](t.dataset.arg);
    if (r === 'nav' || r === 'skip') return;
    render(true);
    if (t.dataset.on === 'zone' && t.closest('#sidebar')) { closeMenu(); var zc = document.querySelector('.cr-zones'); if (zc) zc.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  });
  document.addEventListener('submit', function (e) {
    if (e.target.dataset.form === 'ask') { e.preventDefault(); S.askNote = true; var p = e.target.querySelector('p'); p.textContent = 'Answers with cited sources run in the pilot app. This preview shows the layout only.'; }
  });

  /* mobile menu */
  var scrim;
  function openMenu() {
    document.getElementById('sidebar').classList.add('open');
    scrim = document.createElement('div'); scrim.className = 'scrim'; scrim.addEventListener('click', closeMenu); document.body.appendChild(scrim);
  }
  function closeMenu() {
    document.getElementById('sidebar').classList.remove('open');
    if (scrim) { scrim.remove(); scrim = null; }
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenu(); });

  renderShell();
  window.addEventListener('hashchange', go);
  go();
})();
</script>
</body>
</html>
